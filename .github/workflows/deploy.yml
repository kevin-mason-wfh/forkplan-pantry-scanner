name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        type: choice
        options: [beta, prod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/setup-sam@v2
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: sam build --template-file infra/template.yaml --use-container
      - run: sam deploy --template-file .aws-sam/build/template.yaml --config-env "${{ inputs.stage }}" --no-confirm-changeset --no-fail-on-empty-changeset
