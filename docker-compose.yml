services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_scanner
      POSTGRES_USER: pantry_scanner
      POSTGRES_PASSWORD: pantry_scanner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry_scanner"]
      interval: 5s
      timeout: 3s
      retries: 5
