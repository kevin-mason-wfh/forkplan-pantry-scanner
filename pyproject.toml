[project]
name = "forkplan-pantry-scanner"
version = "0.1.0"
description = "SQS worker for Forkplan pantry photo scans"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aws-lambda-powertools>=3.18.0",
  "Pillow>=13.0.0",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.7",
  "rapidfuzz>=3.13.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.62.0"]
openai = ["openai>=1.99.9"]

[dependency-groups]
dev = [
  "boto3>=1.39.14",
  "moto[s3]>=5.1.9",
  "mypy>=1.17.1",
  "pre-commit>=4.2.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantry_scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pantry_scanner"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pantry_scanner --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["pantry_scanner"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
